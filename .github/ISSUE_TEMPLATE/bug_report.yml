name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace with ...
        2. Change file ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: Any non-default `agentDiffTracker.*` settings.
